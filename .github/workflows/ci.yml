name: Rahal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity project structure
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings
          test -f Assets/Scripts/LoginManager.cs
          test -f Assets/Scripts/HomeManager.cs
          test -f Assets/Scripts/CityManager.cs
          test -f Assets/Scripts/AddPlaceManager.cs
          test -f Assets/Scripts/ProfileManager.cs

      - name: Verify README
        run: |
          test -f README.md
          echo "Rahal project structure verified successfully."
